[project]
dynamic = ["version"]
name = "mrjk.expandvars"
description = "DEPRECATED: use mrjk/python-varstore. Expand system variables Unix style"
keywords = [
    "expand",
    "system",
    "variables",
    "deprecated",
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Topic :: Software Development",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft",
]
authors = [
  {name = "Arijit Basu", email = "sayanarijit@gmail.com"}
]
maintainers = [
  {name = "mrjk", email = "mrjk.78@gmail.com"}
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/mrjk/python-expandvars"
Repository = "https://github.com/mrjk/python-expandvars"
Changelog = "https://github.com/mrjk/python-expandvars/blob/develop/CHANGELOG.md"
Issues = "https://github.com/mrjk/python-expandvars/issues"
Successor = "https://github.com/mrjk/python-varstore"

[project.optional-dependencies]
tests = ["tox", "pytest", "pytest-cov", "black"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "expandvars.py"

# Distribution name differs from the importable module.
[tool.hatch.build.targets.wheel]
only-include = ["expandvars.py"]

[tool.hatch.build.targets.sdist]
include = [
    "/expandvars.py",
    "/tests",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
addopts = [
    "--cov",
    "--cov-report=html",
    "--cov-fail-under=100",
]
